name: windows-build

on:
  push:
    branches: [macos-port]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A Win32 -G "Visual Studio 17 2022"
      - name: Build
        run: cmake --build build --config Release -- /m
      - name: Check codegen against baseline
        shell: cmd
        run: |
          set blitzpath=%CD%\BLITZ3D_INSTALL
          pushd tests\asm_baseline
          ..\..\BLITZ3D_INSTALL\bin\blitzcc.exe -a -c abitest.bb > abitest.out
          ..\..\BLITZ3D_INSTALL\bin\blitzcc.exe -a -c -d abitest.bb > abitest_d.out
          popd
          if not exist tests\asm_baseline\abitest.out (echo "abitest.out missing - blitzcc failed" & exit /b 1)
          if not exist tests\asm_baseline\abitest_d.out (echo "abitest_d.out missing - blitzcc failed" & exit /b 1)
          git diff --no-index --exit-code tests/asm_baseline/abitest.txt abitest.out || exit /b 1
          git diff --no-index --exit-code tests/asm_baseline/abitest_d.txt abitest_d.out || exit /b 1
