name: windows-build

on:
  push:
    branches: [macos-port]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A Win32 -G "Visual Studio 17 2022"
      - name: Build
        run: cmake --build build --config Release -- /m
